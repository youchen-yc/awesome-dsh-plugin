url: https://github.com/youchen-yc/dsh-heartprint
name: youchen-yc/dsh-heartprint
category: memory
description:
  en: "A memory plugin. You can set its personality and character, and give it a name. It shows emotions — skip it if that bothers you. It forgets, but only trivial and useless details; important things are analysed and kept. It remembers the most important things between you and it. Special-event support keeps things that matter to you."
  zh: "记忆类插件。可以设置性格、人格，给它取名字；有情绪，介意勿下载；有淡忘功能，只淡忘琐碎无用的信息，重要的事情会经过分析保留；会记得你跟它之间最重要的事情；有特殊事件功能，特殊意义的事情会被记住。"
